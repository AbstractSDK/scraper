[package]
name = "savings-bot"
version = "0.4.0"
edition = "2021"
publish = false

[[bin]]
name = "local"
path = "src/bin/local.rs"

[dependencies]
cw-orch = { version = "0.27.0", features = ["daemon"] }
cw-orch-interchain = { version = "0.8.1", features = ["daemon"] }

abstract-interface = { git = "https://github.com/AbstractSDK/abstract", version = "0.25.0", tag = "v0.25.0" }
abstract-client = { git = "https://github.com/AbstractSDK/abstract", version = "0.25.0", tag = "v0.25.0" }
abstract-std = { git = "https://github.com/AbstractSDK/abstract", version = "0.25.0", tag = "v0.25.0" }

cw-asset = { version = "3.0" }

cosmwasm-std = { version = "2.0.8" }
cosmos-sdk-proto = { version = "0.26.1", features = ["cosmwasm"] }
dotenv = "0.15.0"
env_logger = { package = "pretty_env_logger", version = "0.2.3" }
log = "0.4.20"
tonic = "0.12.1"
clap = { version = "4", features = ["derive"] }
humantime = "2.1.0"
prometheus = "0.13.2"
tokio = "1.26.0"
warp = "0.3.6"
semver = "1.0"
serde_json = "1"

[patch.crates-io]
# cw-orch = { git = "https://github.com/AbstractSDK/cw-orchestrator", branch = "scraper_updates" }
# cw-orch-interchain = { git = "https://github.com/AbstractSDK/cw-orchestrator", branch = "scraper_updates" }
